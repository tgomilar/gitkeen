# Build the desktop app for macOS, Windows and Linux, and attach the files to
# a draft GitHub release.
#
# Starts when a version tag such as v0.2.0 is pushed (see scripts/release.mjs),
# or by hand from the Actions tab, which makes a draft for the version in
# package.json. Nothing is public until you press Publish on the draft.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job makes the draft, so the four builds add to the same release
  # instead of racing each other to create it.
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # The id comes from the answer to the create request itself. Listing the
        # releases straight after creating one can miss the new draft, and an
        # empty id makes the builds skip every upload.
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "map(select(.tag_name == \"$tag\")) | .[0].id // empty")
          if [ -z "$id" ]; then
            node scripts/release-notes.mjs "$tag" > notes.md
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
              -f name="Gitkeen $version" -F draft=true -F body=@notes.md --jq .id)
          fi
          if [ -z "$id" ]; then echo "::error::Could not find or create the draft release for $tag"; exit 1; fi
          echo "Uploading to release $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install the Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build the backend
        run: node scripts/build-sidecar.mjs
        env:
          TARGET: ${{ matrix.target }}

      - name: Build the app and upload it to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: --target ${{ matrix.target }}
